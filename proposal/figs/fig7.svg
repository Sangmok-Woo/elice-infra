<svg viewBox="0 0 1000 560" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bx{stroke-width:1.5;rx:6}
      .lbl{font-size:13px;fill:#fff;font-weight:700;text-anchor:middle}
      .sm{font-size:11px;fill:#8a919c;text-anchor:middle}
      .ln{stroke:#c4cad3;stroke-width:1.6;fill:none}
      .ln100{stroke:#4f46e5;stroke-width:2.2;fill:none}
      .lnfw{stroke:#d6364f;stroke-width:1.8;fill:none}
      .rack{fill:none;stroke:#dfe3e8;stroke-dasharray:5 4;stroke-width:1.3}
    </style>
  </defs>
  <!-- 인터넷 -->
  <rect x="20" y="15" width="150" height="34" rx="17" fill="#f5f6f8" stroke="#c4cad3"/>
  <text x="95" y="37" text-anchor="middle" font-size="13">인터넷 (ISP-A / ISP-B)</text>
  <!-- 방화벽 -->
  <rect x="20" y="95" width="70" height="40" rx="6" fill="#d6364f"/><text class="lbl" x="55" y="120">fw1</text>
  <rect x="100" y="95" width="70" height="40" rx="6" fill="#d6364f"/><text class="lbl" x="135" y="120">fw2</text>
  <line class="lnfw" x1="70" y1="49" x2="55" y2="95"/><line class="lnfw" x1="120" y1="49" x2="135" y2="95"/>
  <line x1="90" y1="115" x2="100" y2="115" stroke="#d6364f" stroke-width="3"/>
  <text class="sm" x="95" y="88">HA</text>
  <!-- 스파인 -->
  <rect x="330" y="80" width="140" height="44" rx="6" fill="#4f46e5"/><text class="lbl" x="400" y="102">spine1</text><text x="400" y="117" text-anchor="middle" font-size="10" fill="#e0e7ff">R1 · 32×100G</text>
  <rect x="610" y="80" width="140" height="44" rx="6" fill="#4f46e5"/><text class="lbl" x="680" y="102">spine2</text><text x="680" y="117" text-anchor="middle" font-size="10" fill="#e0e7ff">R3 · 32×100G</text>
  <!-- 리프 좌표 -->
  <g id="leaves">
    <rect x="210" y="250" width="90" height="38" rx="6" fill="#149a86"/><text class="lbl" x="255" y="274">leaf1a</text>
    <rect x="310" y="250" width="90" height="38" rx="6" fill="#149a86"/><text class="lbl" x="355" y="274">leaf1b</text>
    <rect x="455" y="250" width="90" height="38" rx="6" fill="#149a86"/><text class="lbl" x="500" y="274">leaf2a</text>
    <rect x="555" y="250" width="90" height="38" rx="6" fill="#149a86"/><text class="lbl" x="600" y="274">leaf2b</text>
    <rect x="700" y="250" width="90" height="38" rx="6" fill="#149a86"/><text class="lbl" x="745" y="274">leaf3a</text>
    <rect x="800" y="250" width="90" height="38" rx="6" fill="#149a86"/><text class="lbl" x="845" y="274">leaf3b</text>
  </g>
  <!-- 리프-스파인 100G -->
  <g class="ln100">
    <line x1="255" y1="250" x2="380" y2="124"/><line x1="255" y1="250" x2="640" y2="124"/>
    <line x1="355" y1="250" x2="390" y2="124"/><line x1="355" y1="250" x2="650" y2="124"/>
    <line x1="500" y1="250" x2="400" y2="124"/><line x1="500" y1="250" x2="665" y2="124"/>
    <line x1="600" y1="250" x2="410" y2="124"/><line x1="600" y1="250" x2="680" y2="124"/>
    <line x1="745" y1="250" x2="420" y2="124"/><line x1="745" y1="250" x2="700" y2="124"/>
    <line x1="845" y1="250" x2="430" y2="124"/><line x1="845" y1="250" x2="715" y2="124"/>
  </g>
  <text x="540" y="66" font-size="11" fill="#4f46e5" text-anchor="middle">리프마다 스파인 2대에 100G 1줄씩 (eBGP unnumbered + BFD)</text>
  <!-- 방화벽-경계리프 -->
  <path class="lnfw" d="M55 135 C 60 200, 200 220, 245 250"/><path class="lnfw" d="M55 135 C 70 215, 300 225, 345 250"/>
  <path class="lnfw" d="M135 135 C 160 190, 420 205, 490 250"/><path class="lnfw" d="M135 135 C 170 200, 520 215, 590 250"/>
  <text x="180" y="108" font-size="10.5" fill="#d6364f">경계 리프로 10G 트렁크</text><text x="180" y="122" font-size="10.5" fill="#d6364f">(transit VLAN 901/902)</text>
  <!-- 랙 박스 -->
  <rect class="rack" x="195" y="232" width="220" height="300"/><text x="205" y="526" font-size="12" fill="#8a919c" font-weight="700">R1</text>
  <rect class="rack" x="440" y="232" width="220" height="300"/><text x="450" y="526" font-size="12" fill="#8a919c" font-weight="700">R2</text>
  <rect class="rack" x="685" y="232" width="220" height="300"/><text x="695" y="526" font-size="12" fill="#8a919c" font-weight="700">R3</text>
  <!-- 서버 -->
  <g font-size="11.5" text-anchor="middle">
    <!-- R1 -->
    <rect x="210" y="340" width="190" height="24" rx="4" fill="#5d6878"/><text x="305" y="357" fill="#fff">ctrl1</text>
    <rect x="210" y="368" width="92" height="24" rx="4" fill="#3d4756"/><text x="256" y="385" fill="#fff">wrk1</text>
    <rect x="308" y="368" width="92" height="24" rx="4" fill="#3d4756"/><text x="354" y="385" fill="#fff">wrk2</text>
    <rect x="210" y="396" width="92" height="24" rx="4" fill="#7a5cd6"/><text x="256" y="413" fill="#fff">ceph1</text>
    <rect x="308" y="396" width="92" height="24" rx="4" fill="#7a5cd6"/><text x="354" y="413" fill="#fff">ceph2</text>
    <!-- R2 -->
    <rect x="455" y="340" width="190" height="24" rx="4" fill="#5d6878"/><text x="550" y="357" fill="#fff">ctrl2</text>
    <rect x="455" y="368" width="92" height="24" rx="4" fill="#3d4756"/><text x="501" y="385" fill="#fff">wrk3</text>
    <rect x="553" y="368" width="92" height="24" rx="4" fill="#3d4756"/><text x="599" y="385" fill="#fff">wrk4</text>
    <rect x="455" y="396" width="92" height="24" rx="4" fill="#7a5cd6"/><text x="501" y="413" fill="#fff">ceph3</text>
    <!-- R3 -->
    <rect x="700" y="340" width="190" height="24" rx="4" fill="#5d6878"/><text x="795" y="357" fill="#fff">ctrl3</text>
    <rect x="700" y="368" width="92" height="24" rx="4" fill="#3d4756"/><text x="746" y="385" fill="#fff">wrk5</text>
    <rect x="700" y="396" width="92" height="24" rx="4" fill="#7a5cd6"/><text x="746" y="413" fill="#fff">ceph4</text>
    <rect x="798" y="368" width="92" height="52" rx="4" fill="#fff" stroke="#d98a1c" stroke-dasharray="4 3"/><text x="844" y="390" fill="#d98a1c">확장 여유</text><text x="844" y="405" fill="#d98a1c" font-size="10">(GPU 확장)</text>
  </g>
  <g class="ln">
    <line x1="255" y1="288" x2="255" y2="340"/><line x1="355" y1="288" x2="355" y2="340"/>
    <line x1="500" y1="288" x2="500" y2="340"/><line x1="600" y1="288" x2="600" y2="340"/>
    <line x1="745" y1="288" x2="745" y2="340"/><line x1="845" y1="288" x2="845" y2="340"/>
  </g>
  <text x="305" y="312" font-size="10.5" fill="#8a919c" text-anchor="middle">각 서버 bond = 리프 a 1줄 + 리프 b 1줄</text>
  <!-- OOB -->
  <rect x="210" y="440" width="190" height="22" rx="4" fill="#fff" stroke="#c4cad3"/><text x="305" y="456" font-size="11" text-anchor="middle" fill="#8a919c">oob1 (1G 관리·BMC)</text>
  <rect x="455" y="440" width="190" height="22" rx="4" fill="#fff" stroke="#c4cad3"/><text x="550" y="456" font-size="11" text-anchor="middle" fill="#8a919c">oob2</text>
  <rect x="700" y="440" width="190" height="22" rx="4" fill="#fff" stroke="#c4cad3"/><text x="795" y="456" font-size="11" text-anchor="middle" fill="#8a919c">oob3</text>
  <line x1="400" y1="451" x2="455" y2="451" stroke="#c4cad3" stroke-dasharray="4 3"/><line x1="645" y1="451" x2="700" y2="451" stroke="#c4cad3" stroke-dasharray="4 3"/>
  <text x="550" y="485" font-size="10.5" fill="#8a919c" text-anchor="middle">관리망(OOB)은 데이터망과 물리적으로 분리</text>
  <!-- 범례 -->
  <g font-size="10.5" fill="#191d24">
    <rect x="20" y="300" width="12" height="12" fill="#5d6878"/><text x="38" y="310">컨트롤러 (2×25G)</text>
    <rect x="20" y="320" width="12" height="12" fill="#3d4756"/><text x="38" y="330">워커 (4×25G)</text>
    <rect x="20" y="340" width="12" height="12" fill="#7a5cd6"/><text x="38" y="350">Ceph (4×25G)</text>
    <line x1="20" y1="368" x2="32" y2="368" stroke="#4f46e5" stroke-width="2.2"/><text x="38" y="372">100G 패브릭</text>
    <line x1="20" y1="386" x2="32" y2="386" stroke="#d6364f" stroke-width="2"/><text x="38" y="390">방화벽 연결</text>
  </g>

  <!-- 흐름 1 (주황) / 흐름 2 (보라 점선) 오버레이 -->
  <defs>
    <marker id="o1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e8590c"/></marker>
    <marker id="o2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7a5cd6"/></marker>
  </defs>
  <g fill="none" stroke="#e8590c" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
    <path d="M78 49 L62 93" marker-end="url(#o1)"/>
    <path d="M60 135 C 90 200, 200 225, 240 248" marker-end="url(#o1)"/>
    <path d="M272 250 L 632 128" marker-end="url(#o1)"/>
    <path d="M705 124 L 748 246" marker-end="url(#o1)"/>
    <path d="M760 288 L 760 366" marker-end="url(#o1)"/>
  </g>
  <g fill="none" stroke="#7a5cd6" stroke-width="2.2" stroke-dasharray="7 5" stroke-linecap="round">
    <path d="M792 384 C 815 370, 830 320, 835 292" marker-end="url(#o2)"/>
    <path d="M820 250 L 452 128" marker-end="url(#o2)"/>
    <path d="M420 126 L 368 246" marker-end="url(#o2)"/>
    <path d="M345 290 C 345 352, 332 388, 296 405" marker-end="url(#o2)"/>
  </g>
  <g font-size="12" font-weight="800" text-anchor="middle" fill="#fff">
    <circle cx="58" cy="66" r="10" fill="#e8590c"/><text x="58" y="70">1</text>
    <circle cx="150" cy="208" r="10" fill="#e8590c"/><text x="150" y="212">2</text>
    <circle cx="470" cy="185" r="10" fill="#e8590c"/><text x="470" y="189">3</text>
    <circle cx="738" cy="185" r="10" fill="#e8590c"/><text x="738" y="189">4</text>
    <circle cx="774" cy="330" r="10" fill="#e8590c"/><text x="774" y="334">5</text>
    <circle cx="840" cy="338" r="10" fill="#7a5cd6"/><text x="840" y="342">a</text>
    <circle cx="630" cy="200" r="10" fill="#7a5cd6"/><text x="630" y="204">b</text>
    <circle cx="378" cy="200" r="10" fill="#7a5cd6"/><text x="378" y="204">c</text>
    <circle cx="358" cy="330" r="10" fill="#7a5cd6"/><text x="358" y="334">d</text>
  </g>
  <g font-size="11" fill="#191d24">
    <line x1="20" y1="410" x2="40" y2="410" stroke="#e8590c" stroke-width="2.6"/><text x="46" y="414">흐름 1 (1~5)</text>
    <line x1="20" y1="430" x2="40" y2="430" stroke="#7a5cd6" stroke-width="2.2" stroke-dasharray="6 4"/><text x="46" y="434">흐름 2 (a~d)</text>
  </g>
</svg>