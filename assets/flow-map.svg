<svg viewBox="0 0 1000 400" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2b50e0"/></marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7a5cd6"/></marker>
    <marker id="m3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4c3a99"/></marker>
    <marker id="m4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8a919c"/></marker>
    <style>
      .bx{font-size:14px;font-weight:700;fill:#fff;text-anchor:middle}
      .sb{font-size:11px;fill:#fff;text-anchor:middle;opacity:.9}
      .num{font-size:12px;font-weight:800;fill:#fff;text-anchor:middle}
      .lb{font-size:11.5px;fill:#333a45;text-anchor:middle}
      .lg{font-size:11.5px;fill:#333a45}
    </style>
  </defs>

  <!-- 범례 -->
  <g>
    <circle cx="28" cy="18" r="9" fill="#2b50e0"/><text class="num" x="28" y="22">1</text><text class="lg" x="42" y="22">손님 요청</text>
    <circle cx="140" cy="18" r="9" fill="#7a5cd6"/><text class="num" x="140" y="22">2</text><text class="lg" x="154" y="22">스토리지 I/O</text>
    <circle cx="262" cy="18" r="9" fill="#4c3a99"/><text class="num" x="262" y="22">3</text><text class="lg" x="276" y="22">복제</text>
    <circle cx="336" cy="18" r="9" fill="#8a919c"/><text class="num" x="336" y="22">4</text><text class="lg" x="350" y="22">관리 (물리적으로 다른 망)</text>
    <circle cx="530" cy="18" r="9" fill="#d6364f"/><text class="num" x="530" y="22">5</text><text class="lg" x="544" y="22">막혀야 하는 패킷</text>
  </g>

  <!-- 상자 -->
  <rect x="20" y="110" width="112" height="58" rx="8" fill="#5d6878"/><text class="bx" x="76" y="135">사용자</text><text class="sb" x="76" y="154">인터넷</text>
  <rect x="190" y="110" width="128" height="58" rx="8" fill="#d6364f"/><text class="bx" x="254" y="135">방화벽 HA</text><text class="sb" x="254" y="154">구역 사이의 유일한 문</text>
  <rect x="376" y="110" width="150" height="58" rx="8" fill="#149a86"/><text class="bx" x="451" y="135">리프 · 스파인</text><text class="sb" x="451" y="154">VRF로 길을 나눈 패브릭</text>
  <rect x="584" y="110" width="138" height="58" rx="8" fill="#3d4756"/><text class="bx" x="653" y="135">워커 (Ingress)</text><text class="sb" x="653" y="154">웹 서비스</text>
  <rect x="790" y="110" width="88" height="58" rx="8" fill="#7a5cd6"/><text class="bx" x="834" y="135">Ceph</text><text class="sb" x="834" y="154">받은 노드</text>
  <rect x="902" y="110" width="80" height="58" rx="8" fill="#4c3a99"/><text class="bx" x="942" y="135">Ceph ×2</text><text class="sb" x="942" y="154">복제본</text>

  <!-- 흐름 1 -->
  <line x1="132" y1="139" x2="186" y2="139" stroke="#2b50e0" stroke-width="3" marker-end="url(#m1)"/>
  <line x1="318" y1="139" x2="372" y2="139" stroke="#2b50e0" stroke-width="3" marker-end="url(#m1)"/>
  <line x1="526" y1="139" x2="580" y2="139" stroke="#2b50e0" stroke-width="3" marker-end="url(#m1)"/>
  <circle cx="347" cy="196" r="10" fill="#2b50e0"/><text class="num" x="347" y="200">1</text>
  <text class="lb" x="347" y="220">구역을 넘으므로 방화벽 통과</text>

  <!-- 흐름 2 -->
  <path d="M640 168 C 628 236, 492 236, 476 174" fill="none" stroke="#7a5cd6" stroke-width="3" marker-end="url(#m2)"/>
  <path d="M500 168 C 540 262, 806 262, 830 174" fill="none" stroke="#7a5cd6" stroke-width="3" marker-end="url(#m2)"/>
  <circle cx="665" cy="244" r="10" fill="#7a5cd6"/><text class="num" x="665" y="248">2</text>
  <text class="lb" x="665" y="272">전용 NIC · MTU 9000</text>
  <text class="lb" x="665" y="288">패브릭은 지나지만 방화벽은 거치지 않음</text>

  <!-- 흐름 3 -->
  <line x1="878" y1="139" x2="898" y2="139" stroke="#4c3a99" stroke-width="3" marker-end="url(#m3)"/>
  <circle cx="900" cy="212" r="10" fill="#4c3a99"/><text class="num" x="900" y="216">3</text>
  <line x1="900" y1="202" x2="890" y2="146" stroke="#4c3a99" stroke-width="1" stroke-dasharray="2 3"/>
  <text class="lb" x="930" y="238">또 다른 NIC</text>
  <text class="lb" x="930" y="254">밖으로 길 없음</text>

  <!-- 흐름 5: 외부에서 스토리지로 가려는 패킷 -->
  <path d="M76 110 C 76 60, 200 58, 240 72" fill="none" stroke="#d6364f" stroke-width="2.5" stroke-dasharray="6 4"/>
  <g stroke="#d6364f" stroke-width="3.5" stroke-linecap="round"><line x1="246" y1="66" x2="262" y2="82"/><line x1="262" y1="66" x2="246" y2="82"/></g>
  <circle cx="290" cy="74" r="10" fill="#d6364f"/><text class="num" x="290" y="78">5</text>
  <text x="308" y="72" font-size="11.5" fill="#333a45">외부 → 스토리지 · 관리망: 방화벽에서 끝</text>
  <text x="308" y="88" font-size="11.5" fill="#333a45">워커 → 복제망: 라우팅 표에 길이 없어 리프에서 끝</text>

  <!-- 흐름 4 -->
  <rect x="20" y="332" width="112" height="44" rx="8" fill="#fff" stroke="#8a919c" stroke-width="1.5"/><text x="76" y="359" font-size="13" font-weight="700" fill="#333a45" text-anchor="middle">운영자</text>
  <rect x="190" y="332" width="128" height="44" rx="8" fill="#fff" stroke="#8a919c" stroke-width="1.5"/><text x="254" y="359" font-size="13" font-weight="700" fill="#333a45" text-anchor="middle">VPN · 배스천</text>
  <rect x="376" y="332" width="606" height="44" rx="8" fill="#f5f6f8" stroke="#8a919c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="679" y="359" font-size="13" font-weight="700" fill="#333a45" text-anchor="middle">관리망(OOB) — 모든 장비의 관리 포트와 서버 BMC</text>
  <line x1="132" y1="354" x2="186" y2="354" stroke="#8a919c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m4)"/>
  <line x1="318" y1="354" x2="372" y2="354" stroke="#8a919c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m4)"/>
  <circle cx="161" cy="322" r="10" fill="#8a919c"/><text class="num" x="161" y="326">4</text>
</svg>
