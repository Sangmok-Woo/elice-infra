! spine2 — inventory/site.yml 에서 생성. 손으로 고치지 말 것
frr version 10.2
frr defaults datacenter
hostname spine2
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.10.0.2/32
!
interface eth1
 description fabric-downlink
 ipv6 nd ra-interval 5
 no ipv6 nd suppress-ra
!
interface eth2
 description fabric-downlink
 ipv6 nd ra-interval 5
 no ipv6 nd suppress-ra
!
interface eth3
 description fabric-downlink
 ipv6 nd ra-interval 5
 no ipv6 nd suppress-ra
!
interface eth4
 description fabric-downlink
 ipv6 nd ra-interval 5
 no ipv6 nd suppress-ra
!
interface eth5
 description fabric-downlink
 ipv6 nd ra-interval 5
 no ipv6 nd suppress-ra
!
interface eth6
 description fabric-downlink
 ipv6 nd ra-interval 5
 no ipv6 nd suppress-ra
!
router bgp 65100
 bgp router-id 10.10.0.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC bfd
 neighbor FABRIC timers 3 9
 neighbor eth1 interface peer-group FABRIC
 neighbor eth2 interface peer-group FABRIC
 neighbor eth3 interface peer-group FABRIC
 neighbor eth4 interface peer-group FABRIC
 neighbor eth5 interface peer-group FABRIC
 neighbor eth6 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  network 10.10.0.2/32
  maximum-paths 64
 exit-address-family
 !
 ! 스파인은 EVPN 경로를 중계만 한다. next-hop을 바꾸면 VXLAN 터널 목적지가 스파인이 되어 깨진다
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC attribute-unchanged next-hop
 exit-address-family
exit
!
line vty
!
