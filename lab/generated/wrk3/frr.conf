! wrk3 — K8s 노드의 BGP 스피커 역할 (운영에서는 Cilium BGP Control Plane)
frr version 10.2
frr defaults datacenter
hostname wrk3
log stdout informational
service integrated-vtysh-config
!
router bgp 65200
 bgp router-id 10.10.16.23
 no bgp ebgp-requires-policy
 neighbor 10.10.16.1 remote-as external
 neighbor 10.10.16.1 timers 3 9
 !
 address-family ipv4 unicast
  network 10.10.32.10/32
 exit-address-family
exit
!
