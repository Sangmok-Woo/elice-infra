! leaf2b — inventory/site.yml 에서 생성. 손으로 고치지 말 것
frr version 10.2
frr defaults datacenter
hostname leaf2b
log stdout informational
service integrated-vtysh-config
!
vrf PROD
 vni 50010
 ip route 0.0.0.0/0 10.10.250.1
exit-vrf
!
vrf STORAGE
 vni 50020
 ip route 0.0.0.0/0 10.10.250.9
exit-vrf
!
vrf REPL
 vni 50030
exit-vrf
!
interface lo
 ip address 10.10.0.14/32
 ip address 10.10.1.14/32
!
interface eth49
 description fabric-uplink
 ipv6 nd ra-interval 5
 no ipv6 nd suppress-ra
!
interface eth50
 description fabric-uplink
 ipv6 nd ra-interval 5
 no ipv6 nd suppress-ra
!
! K8s 노드가 광고해도 되는 것은 LB VIP와 노드별 Pod 대역뿐
ip prefix-list K8S-IN seq 10 permit 10.10.32.0/24 le 32
ip prefix-list K8S-IN seq 20 permit 10.20.0.0/16 ge 24 le 24
ip prefix-list K8S-IN seq 99 deny any
ip prefix-list DENY-ALL seq 5 deny any
!
router bgp 65114
 bgp router-id 10.10.0.14
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC bfd
 neighbor FABRIC timers 3 9
 neighbor eth49 interface peer-group FABRIC
 neighbor eth50 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  network 10.10.0.14/32
  network 10.10.1.14/32
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  advertise-all-vni
  vni 10110
   route-target import 65000:10110
   route-target export 65000:10110
  exit-vni
  vni 10120
   route-target import 65000:10120
   route-target export 65000:10120
  exit-vni
  vni 10130
   route-target import 65000:10130
   route-target export 65000:10130
  exit-vni
  vni 10901
   route-target import 65000:10901
   route-target export 65000:10901
  exit-vni
  vni 10902
   route-target import 65000:10902
   route-target export 65000:10902
  exit-vni
 exit-address-family
exit
!
router bgp 65114 vrf PROD
 bgp router-id 10.10.0.14
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor K8S peer-group
 neighbor K8S remote-as 65200
 neighbor K8S timers 3 9
 bgp listen range 10.10.16.0/24 peer-group K8S
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
  maximum-paths 64
  neighbor K8S prefix-list K8S-IN in
  neighbor K8S prefix-list DENY-ALL out
  neighbor K8S maximum-prefix 300
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:50010
  route-target export 65000:50010
 exit-address-family
exit
!
router bgp 65114 vrf STORAGE
 bgp router-id 10.10.0.14
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:50020
  route-target export 65000:50020
 exit-address-family
exit
!
router bgp 65114 vrf REPL
 bgp router-id 10.10.0.14
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
  maximum-paths 64
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:50030
  route-target export 65000:50030
 exit-address-family
exit
!
line vty
!
