    - endpoints: ["ceph1:eth3", "leaf1a:eth7"]
    - endpoints: ["ceph1:eth4", "leaf1b:eth7"]
    - endpoints: ["ceph2:eth1", "leaf1a:eth8"]
    - endpoints: ["ceph2:eth2", "leaf1b:eth8"]
    - endpoints: ["ceph2:eth3", "leaf1a:eth9"]
    - endpoints: ["ceph2:eth4", "leaf1b:eth9"]
    - endpoints: ["ceph3:eth1", "leaf2a:eth6"]
    - endpoints: ["ceph3:eth2", "leaf2b:eth6"]
